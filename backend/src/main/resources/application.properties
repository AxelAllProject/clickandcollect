# Configuration de la base PostgreSQL : par defaut on pointe sur localhost
# (utile hors Docker, ex. `docker compose up db` puis `mvnw spring-boot:run`),
# docker-compose passe ses propres valeurs via ces memes variables d'environnement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clickandcollect}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Option pour que Hibernate crée tes tables automatiquement
spring.jpa.hibernate.ddl-auto=update

# Secret JWT : lu depuis la variable d'environnement JWT_SECRET si elle existe,
# sinon on retombe sur la valeur par défaut ci-dessous (pratique en dev local)
jwt.secret=${JWT_SECRET:MaCleSecreteHyperLonguePourClickAndCollect123456789!}

# Cles Stripe (mode test) : a definir en variables d'environnement, jamais en dur en prod
# Recuperables sur https://dashboard.stripe.com/test/apikeys une fois un compte Stripe cree
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}