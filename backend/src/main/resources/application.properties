# Configuration de la base H2
spring.datasource.url=jdbc:h2:mem:clickandcollectdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Option pour que Hibernate crée tes tables automatiquement
spring.jpa.hibernate.ddl-auto=update

# Activer la console H2 sur ton navigateur
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Secret JWT : lu depuis la variable d'environnement JWT_SECRET si elle existe,
# sinon on retombe sur la valeur par défaut ci-dessous (pratique en dev local)
jwt.secret=${JWT_SECRET:MaCleSecreteHyperLonguePourClickAndCollect123456789!}