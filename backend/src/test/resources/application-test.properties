# Profil "test" : base H2 en memoire, recreee a chaque execution.
# Docker n'etant pas requis, la suite tourne partout (poste dev comme CI).
spring.datasource.url=jdbc:h2:mem:clickandcollect;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Secrets factices : aucun appel reseau n'est fait, Stripe/Google/mail sont mockes.
jwt.secret=CleDeTestUniquementPourLaSuiteDeTestsClickAndCollect1234567890
stripe.secret-key=sk_test_fake
stripe.publishable-key=pk_test_fake
stripe.webhook-secret=whsec_fake
google.client-id=test-google-client-id
app.frontend-url=http://localhost:5173
app.mail.from=no-reply@test.local

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
