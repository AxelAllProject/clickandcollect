server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router gère les routes côté client : toute route inconnue
    # doit quand même servir index.html, sinon un refresh sur /catalog renvoie 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
